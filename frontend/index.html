<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySync AI | Agentic Student Co-Pilot</title>
  
  <!-- Pico CSS (Pinned v1.5.10 for stable layout) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1.5.10/css/pico.min.css">
  <link rel="stylesheet" href="css/custom.css">
  
  <!-- Alpine JS (Pinned v3.13.5) -->
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body x-data="studySyncApp()">
  <main class="container" style="padding-top: 2rem;">
    <header>
      <nav>
        <ul>
          <li><strong>🎓 StudySync AI</strong></li>
        </ul>
        <ul>
          <li><button class="tab-btn" :class="activeTab === 'ingest' ? '' : 'secondary'" @click="activeTab = 'ingest'">Courses & Ingest</button></li>
          <li><button class="tab-btn" :class="activeTab === 'session' ? '' : 'secondary'" @click="activeTab = 'session'">Study Session</button></li>
          <li><button class="tab-btn" :class="activeTab === 'flashcards' ? '' : 'secondary'" @click="activeTab = 'flashcards'">Flashcards</button></li>
          <li><button class="tab-btn" :class="activeTab === 'balance' ? '' : 'secondary'" @click="activeTab = 'balance'">Life Balance</button></li>
        </ul>
      </nav>
    </header>

    <!-- INGEST & COURSES TAB -->
    <section x-show="activeTab === 'ingest'">
      <article>
        <h3>Add New Course & Ingest Notes</h3>
        <form @submit.prevent="createCourse()">
          <label>Course Title
            <input type="text" x-model="newCourse.title" placeholder="e.g., Biology 101" required>
          </label>
          <label>Course Description
            <input type="text" x-model="newCourse.description" placeholder="Short summary" required>
          </label>
          <button type="submit">Create Course</button>
        </form>
      </article>

      <article>
        <h3>Ingest Topic Notes into RAG</h3>
        <form @submit.prevent="createTopic()">
          <label>Course ID
            <input type="number" x-model.number="newTopic.course_id" required>
          </label>
          <label>Topic Title
            <input type="text" x-model="newTopic.title" placeholder="e.g., Mitosis & Cell Division" required>
          </label>
          <label>Raw Content / Notes
            <textarea x-model="newTopic.content" rows="4" placeholder="Paste textbook or lecture notes..." required></textarea>
          </label>
          <button type="submit" class="contrast">Embed Topic into ChromaDB</button>
        </form>
      </article>
    </section>

    <!-- STUDY SESSION TAB -->
    <section x-show="activeTab === 'session'">
      <article>
        <h3>Start Agentic Study Session</h3>
        <div class="grid">
          <input type="number" x-model.number="sessionTopicId" placeholder="Enter Topic ID (e.g., 1)">
          <button @click="startSession()" :aria-busy="loadingSession">Run Multi-Agent Cycle</button>
        </div>
      </article>

      <template x-if="sessionData">
        <div>
          <article>
            <h4 x-text="'Lesson: ' + sessionData.topic_title"></h4>
            <div x-html="formatMarkdown(sessionData.explanation)"></div>
          </article>

          <article>
            <h4>Generated Quiz (Grok Agent)</h4>
            <template x-for="(q, index) in sessionData.quiz" :key="q.id">
              <fieldset>
                <legend><strong x-text="(index + 1) + '. ' + q.question"></strong></legend>
                <template x-for="opt in q.options" :key="opt">
                  <label>
                    <input type="radio" :name="'q_' + q.id" :value="opt" x-model="userAnswers[q.id]">
                    <span x-text="opt"></span>
                  </label>
                </template>
              </fieldset>
            </template>
          </article>
        </div>
      </template>
    </section>

    <!-- FLASHCARDS TAB -->
    <section x-show="activeTab === 'flashcards'">
      <article>
        <h3>Add Flashcard</h3>
        <form @submit.prevent="createFlashcard()">
          <div class="grid">
            <input type="number" x-model.number="newCard.topic_id" placeholder="Topic ID" required>
            <input type="text" x-model="newCard.front" placeholder="Front Question" required>
            <input type="text" x-model="newCard.back" placeholder="Back Answer" required>
          </div>
          <button type="submit">Add Card</button>
        </form>
      </article>

      <template x-if="activeCard">
        <article>
          <h3>Spaced Repetition Review (SM-2)</h3>
          <div class="flashcard" @click="showAnswer = !showAnswer">
            <span x-text="showAnswer ? activeCard.back : activeCard.front"></span>
          </div>
          <p><small>(Click card to flip)</small></p>

          <div class="grid" x-show="showAnswer">
            <button class="secondary" @click="rateCard(1)">1 - Blank</button>
            <button class="secondary" @click="rateCard(3)">3 - Good</button>
            <button class="primary" @click="rateCard(5)">5 - Perfect</button>
          </div>
        </article>
      </template>
    </section>

    <!-- LIFE BALANCE TAB -->
    <section x-show="activeTab === 'balance'">
      <article>
        <h3>Life Balance Coach (FastMCP Tool)</h3>
        <form @submit.prevent="computeBalance()">
          <div class="grid">
            <label>Upcoming Assignments
              <input type="number" x-model.number="workload.upcoming_assignments">
            </label>
            <label>Recent Study Hours
              <input type="number" step="0.5" x-model.number="workload.recent_study_hours">
            </label>
          </div>
          <button type="submit">Calculate Leisure Budget</button>
        </form>

        <template x-if="balanceData">
          <div style="margin-top: 1.5rem;">
            <h4>Recommended Leisure: <span x-text="balanceData.daily_leisure_hours + ' Hours'"></span></h4>
            <p><strong>Reasoning:</strong> <span x-text="balanceData.reasoning"></span></p>
          </div>
        </template>
      </article>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
